<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life OS — Flashcards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
      min-height: 100vh;
    }
    .page-loader {
      position: fixed;
      inset: 0;
      background: #060606;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .page-loader.hide { opacity: 0; pointer-events: none; }
    .loader-bolt {
      font-size: 1.8rem;
      animation: loaderPulse 0.6s ease infinite alternate;
    }
    @keyframes loaderPulse {
      0%   { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1;   transform: scale(1.1); }
    }
    .container {
      width: 100%;
      max-width: 520px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .container.show { opacity: 1; transform: translateY(0); }
    .back { display: inline-block; color: #c9a84c; font-size: 0.82rem; text-decoration: none; margin-bottom: 16px; }
    h1 { color: #c9a84c; font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #555; font-size: 0.85rem; margin-bottom: 24px; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-num { font-size: 1.4rem; font-weight: 700; color: #c9a84c; }
    .stat-label { font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* Subject filter */
    .subject-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .sub-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      background: none;
      color: #555;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-btn.active { background: #c9a84c; border-color: #c9a84c; color: #000; font-weight: bold; }

    /* Review section */
    .review-section {
      margin-bottom: 20px;
    }

    .card-scene {
      perspective: 1000px;
      height: 220px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .card-3d.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backface-visibility: hidden;
      text-align: center;
    }

    .card-face.back {
      transform: rotateY(180deg);
      background: #141200;
      border-color: #c9a84c44;
    }

    .card-label {
      font-size: 0.68rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .card-text {
      font-size: 1.05rem;
      color: #f0f0f0;
      line-height: 1.6;
      font-weight: 500;
    }

    .card-face.back .card-text { color: #c9a84c; }

    .card-hint {
      position: absolute;
      bottom: 14px;
      font-size: 0.72rem;
      color: #2a2a2a;
    }

    .card-subject-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .badge-Physics   { background: #1a2a3a; color: #4a9eff; border: 1px solid #4a9eff44; }
    .badge-Chemistry { background: #1a3a2a; color: #4caf50; border: 1px solid #4caf5044; }
    .badge-Maths     { background: #3a1a3a; color: #c97aff; border: 1px solid #c97aff44; }
    .badge-Other     { background: #2a2a2a; color: #888;    border: 1px solid #44444444; }

    /* Rating buttons */
    .rating-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .rate-btn {
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .rate-missed  { background: #3a1a1a; color: #e05c5c; border: 1px solid #e05c5c44; }
    .rate-almost  { background: #3a3a1a; color: #c9a84c; border: 1px solid #c9a84c44; }
    .rate-got     { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf5044; }

    .rate-missed:hover  { background: #e05c5c; color: #fff; }
    .rate-almost:hover  { background: #c9a84c; color: #000; }
    .rate-got:hover     { background: #4caf50; color: #000; }

    .no-cards {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .no-cards-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .no-cards-text { color: #555; font-size: 0.9rem; line-height: 1.6; }
    .no-cards-text b { color: #c9a84c; }

    /* Add card section */
    .add-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .add-card h2 {
      font-size: 0.85rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 70px;
      font-family: sans-serif;
      outline: none;
      margin-bottom: 10px;
    }

    textarea:focus { border-color: #c9a84c; }

    select {
      width: 100%;
      padding: 10px 12px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      font-size: 0.88rem;
      margin-bottom: 10px;
      outline: none;
    }

    select:focus { border-color: #c9a84c; }
    select option { background: #111; }

    .add-btn {
      width: 100%;
      padding: 12px;
      background: #c9a84c;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover { background: #e0c068; }

    /* All cards list */
    .cards-list {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 30px;
    }

    .cards-list h2 {
      font-size: 0.85rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .card-item {
      padding: 12px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .card-item:last-child { border-bottom: none; }

    .card-item-q {
      font-size: 0.88rem;
      color: #f0f0f0;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-item-a {
      font-size: 0.8rem;
      color: #444;
      margin-bottom: 6px;
    }

    .card-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-item-meta { font-size: 0.72rem; color: #333; }

    .delete-btn {
      background: none;
      border: none;
      color: #2a2a2a;
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: #e05c5c; }
    .empty { color: #333; font-size: 0.82rem; text-align: center; padding: 16px 0; }

    /* Progress bar */
    .progress-wrap {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 10px;
    }

    .progress-bar {
      background: #1a1a1a;
      border-radius: 10px;
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c9a84c, #e0c068);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="loader-bolt">⚡</div>
</div>

<div class="container" id="pageContent">
  <a href="../index.html" class="back">← Life OS</a>
  <h1>🃏 Flashcards</h1>
  <p class="subtitle">Review smarter. Remember longer.</p>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statDue">0</div>
      <div class="stat-label">Due Today</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statMastered">0</div>
      <div class="stat-label">Mastered</div>
    </div>
  </div>

  <div class="subject-tabs">
    <button class="sub-btn active" onclick="setSubject('All')">All</button>
    <button class="sub-btn" onclick="setSubject('Physics')">⚡ Physics</button>
    <button class="sub-btn" onclick="setSubject('Chemistry')">🧪 Chemistry</button>
    <button class="sub-btn" onclick="setSubject('Maths')">📐 Maths</button>
    <button class="sub-btn" onclick="setSubject('Other')">📝 Other</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>Session Progress</span>
      <span id="progressText">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div id="reviewSection"></div>

  <div class="add-card">
    <h2>➕ Add New Card</h2>
    <textarea id="question" placeholder="Question — e.g. What is Newton's Second Law?"></textarea>
    <textarea id="answer" placeholder="Answer — e.g. F = ma. Force equals mass times acceleration."></textarea>
    <select id="subject">
      <option value="Physics">⚡ Physics</option>
      <option value="Chemistry">🧪 Chemistry</option>
      <option value="Maths">📐 Maths</option>
      <option value="Other">📝 Other</option>
    </select>
    <button class="add-btn" onclick="addCard()">Add Card</button>
  </div>

  <div class="cards-list">
    <h2>📚 All Cards</h2>
    <p class="empty" id="listEmpty">No cards yet. Add your first one above.</p>
    <div id="cardsList"></div>
  </div>
</div>

<script>
// Animation
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var loader  = document.getElementById('pageLoader');
    var content = document.getElementById('pageContent');
    if (loader)  { loader.classList.add('hide'); setTimeout(function(){ loader.style.display='none'; }, 500); }
    if (content) content.classList.add('show');
  }, 600);
});

var cards        = JSON.parse(localStorage.getItem('lifeos_flashcards')) || [];
var currentSub   = 'All';
var sessionQueue = [];
var sessionIdx   = 0;
var flipped      = false;
var sessionDone  = 0;

function setSubject(sub) {
  currentSub = sub;
  document.querySelectorAll('.sub-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.includes(sub) || (sub === 'All' && b.textContent === 'All'));
  });
  buildQueue();
  renderAll();
}

function buildQueue() {
  var today = new Date().toDateString();
  var pool  = cards.filter(function(c) {
    var subMatch = currentSub === 'All' || c.subject === currentSub;
    var due      = !c.nextReview || new Date(c.nextReview) <= new Date();
    return subMatch && due;
  });
  sessionQueue = pool.slice();
  sessionIdx   = 0;
  sessionDone  = 0;
  flipped      = false;
}

function addCard() {
  var q = document.getElementById('question').value.trim();
  var a = document.getElementById('answer').value.trim();
  var s = document.getElementById('subject').value;

  if (!q || !a) { alert('Please fill in both question and answer.'); return; }

  var card = {
    id:         Date.now(),
    question:   q,
    answer:     a,
    subject:    s,
    nextReview: new Date().toISOString(),
    interval:   1,
    mastered:   false,
    date:       new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short' })
  };

  cards.push(card);
  save();
  document.getElementById('question').value = '';
  document.getElementById('answer').value   = '';
  buildQueue();
  renderAll();
}

function deleteCard(id) {
  cards = cards.filter(function(c){ return c.id !== id; });
  save();
  buildQueue();
  renderAll();
}

function rate(rating) {
  if (sessionIdx >= sessionQueue.length) return;

  var card = sessionQueue[sessionIdx];
  var idx  = cards.findIndex(function(c){ return c.id === card.id; });
  if (idx === -1) return;

  // Spaced repetition logic
  if (rating === 'got') {
    cards[idx].interval  = Math.min((cards[idx].interval || 1) * 2, 30);
    cards[idx].mastered  = cards[idx].interval >= 14;
  } else if (rating === 'almost') {
    cards[idx].interval  = Math.max((cards[idx].interval || 1), 1);
    cards[idx].mastered  = false;
  } else {
    cards[idx].interval  = 1;
    cards[idx].mastered  = false;
  }

  var next = new Date();
  next.setDate(next.getDate() + cards[idx].interval);
  cards[idx].nextReview = next.toISOString();

  save();
  sessionDone++;
  sessionIdx++;
  flipped = false;
  renderAll();
}

function flipCard() {
  var c3d = document.getElementById('card3d');
  if (!c3d) return;
  flipped = !flipped;
  c3d.classList.toggle('flipped', flipped);
}

function save() {
  localStorage.setItem('lifeos_flashcards', JSON.stringify(cards));
}

function renderAll() {
  renderStats();
  renderReview();
  renderList();
  renderProgress();
}

function renderStats() {
  var today    = new Date();
  var due      = cards.filter(function(c){
    var subMatch = currentSub === 'All' || c.subject === currentSub;
    return subMatch && (!c.nextReview || new Date(c.nextReview) <= today);
  }).length;
  var mastered = cards.filter(function(c){ return c.mastered; }).length;
  var total    = currentSub === 'All' ? cards.length : cards.filter(function(c){ return c.subject === currentSub; }).length;

  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statDue').textContent      = due;
  document.getElementById('statMastered').textContent = mastered;
}

function renderProgress() {
  var total = sessionQueue.length + sessionDone;
  var pct   = total > 0 ? Math.round((sessionDone / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = sessionDone + ' / ' + total;
}

function renderReview() {
  var section = document.getElementById('reviewSection');

  if (sessionQueue.length === 0) {
    buildQueue();
  }

  if (sessionIdx >= sessionQueue.length) {
    section.innerHTML =
      '<div class="no-cards">' +
        '<div class="no-cards-icon">✅</div>' +
        '<div class="no-cards-text">' +
          (cards.length === 0
            ? 'No cards yet. Add your first card below.'
            : sessionDone > 0
              ? '<b>' + sessionDone + ' cards reviewed!</b><br>All caught up for now. Come back tomorrow.'
              : 'No cards due right now.<br>Add more cards or switch subject.') +
        '</div>' +
      '</div>';
    return;
  }

  var c = sessionQueue[sessionIdx];

  section.innerHTML =
    '<div class="review-section">' +
      '<div class="card-scene" onclick="flipCard()">' +
        '<div class="card-3d" id="card3d">' +
          '<div class="card-face front">' +
            '<span class="card-subject-badge badge-' + c.subject + '">' + c.subject + '</span>' +
            '<div class="card-label">Question</div>' +
            '<div class="card-text">' + c.question + '</div>' +
            '<div class="card-hint">Tap to reveal answer</div>' +
          '</div>' +
          '<div class="card-face back">' +
            '<div class="card-label">Answer</div>' +
            '<div class="card-text">' + c.answer + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rating-btns">' +
        '<button class="rate-btn rate-missed" onclick="rate(\'missed\')">❌ Missed</button>' +
        '<button class="rate-btn rate-almost" onclick="rate(\'almost\')">🟡 Almost</button>' +
        '<button class="rate-btn rate-got"    onclick="rate(\'got\')">✅ Got it</button>' +
      '</div>' +
    '</div>';
}

function renderList() {
  var list  = document.getElementById('cardsList');
  var empty = document.getElementById('listEmpty');
  var pool  = currentSub === 'All' ? cards : cards.filter(function(c){ return c.subject === currentSub; });

  list.innerHTML = '';
  if (pool.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  pool.slice().reverse().forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML =
      '<div class="card-item-q">' + c.question + '</div>' +
      '<div class="card-item-a">' + c.answer + '</div>' +
      '<div class="card-item-footer">' +
        '<span class="card-item-meta">' +
          '<span class="card-subject-badge badge-' + c.subject + '" style="padding:2px 8px;border-radius:8px;font-size:0.68rem;font-weight:bold;">' + c.subject + '</span>' +
          (c.mastered ? ' · 🏆 Mastered' : '') +
        '</span>' +
        '<button class="delete-btn" onclick="deleteCard(' + c.id + ')">✕</button>' +
      '</div>';
    list.appendChild(div);
  });
}

buildQueue();
renderAll();
</script>
</body>
</html>
