<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life OS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c9a84c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060606;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 15% 40%, rgba(201,168,76,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(201,168,76,0.05) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 80%, rgba(201,168,76,0.04) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .greeting {
      text-align: center;
      margin-bottom: 8px;
    }

    .greeting-text {
      font-size: 0.85rem;
      color: #555;
      letter-spacing: 1px;
    }

    .greeting-time {
      font-size: 0.78rem;
      color: #333;
      margin-top: 4px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
      margin-top: 16px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 20px;
      font-size: 0.72rem;
      color: #c9a84c;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .life {
      background: linear-gradient(135deg, #c9a84c 0%, #e8c96a 50%, #c9a84c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .os {
      color: #ffffff;
      margin-left: 12px;
    }

    .hero-sub {
      font-size: 0.92rem;
      color: #444;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .hero-name {
      font-size: 0.78rem;
      color: #2a2a2a;
      font-weight: 500;
    }

    .hero-name span {
      color: #c9a84c;
      font-weight: 600;
    }

    .dashboard {
      background: rgba(201,168,76,0.04);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .dashboard::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .dashboard-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .dashboard-date {
      font-size: 0.72rem;
      color: #333;
    }

    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .dash-stat {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .dash-stat-num {
      font-size: 1.4rem;
      font-weight: 700;
      color: #c9a84c;
      line-height: 1;
      margin-bottom: 4px;
    }

    .dash-stat-label {
      font-size: 0.68rem;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .focus-section {
      border-top: 1px solid rgba(201,168,76,0.1);
      padding-top: 14px;
    }

    .focus-label {
      font-size: 0.7rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .focus-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 0.84rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .focus-item:last-child { border-bottom: none; }

    .focus-item-text { color: #bbb; line-height: 1.5; }
    .focus-item-text b { color: #c9a84c; }
    .focus-item-sub { font-size: 0.72rem; color: #444; margin-top: 2px; }

    .focus-empty { font-size: 0.84rem; color: #333; line-height: 1.6; }
    .focus-empty b { color: #c9a84c; }

    .focus-cta {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 18px;
      background: #c9a84c;
      color: #000;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 28px;
    }

    .stat { text-align: center; }

    .stat-num {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c9a84c, #e8c96a);
      -webkit-background-clip: text;
